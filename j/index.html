<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초대 · 제때</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E4ECF3">
<meta property="og:title" content="제때 — 같이 쓰는 공간에 초대받았어요">
<meta property="og:description" content="유통기한·만료일을 가족과 같이 챙겨요.">
<meta property="og:image" content="https://junishstudio.github.io/jettae-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 제때 앱 얼음 유리 톤(tokens.dart와 같은 색). 초대 코드 공유 링크 착지 페이지 — 코드를 보여 주고 앱으로 안내한다. */
  :root{--bg:#E4ECF3;--ink:#1B2A3A;--muted:#56697C;--mint:#008C80;--mintSoft:#D8F3EF;
        --sans:Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-text-size-adjust:100%;word-break:keep-all;position:relative;overflow-x:hidden}
  body::before,body::after{content:'';position:fixed;border-radius:50%;z-index:-1;pointer-events:none}
  body::before{width:520px;height:520px;left:-200px;top:-120px;background:radial-gradient(circle,rgba(159,227,218,.85),rgba(159,227,218,0) 70%)}
  body::after{width:480px;height:480px;right:-200px;bottom:-160px;background:radial-gradient(circle,rgba(198,216,255,.9),rgba(198,216,255,0) 70%)}
  main{max-width:420px;margin:0 auto;padding:48px 16px 40px;display:flex;flex-direction:column;gap:18px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:44px;height:44px;border-radius:12px}
  .brand b{font-size:18px}
  h1{margin:6px 0 0;font-size:26px;font-weight:300;letter-spacing:-.03em;line-height:1.35}
  h1 strong{font-weight:700}
  .card{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:22px 20px;
        box-shadow:0 10px 30px rgba(27,42,58,.08)}
  .label{font-size:13px;font-weight:600;color:var(--muted)}
  .code{margin-top:8px;font-size:34px;font-weight:700;letter-spacing:.14em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .copy{margin-top:14px;width:100%;height:50px;border:0;border-radius:16px;background:var(--ink);color:#fff;
        font:700 15px var(--sans);cursor:pointer}
  .copy.done{background:var(--mint)}
  ol{margin:0;padding-left:20px;font-size:14.5px;line-height:1.75;color:var(--ink)}
  .stores{display:flex;flex-direction:column;gap:10px}
  .store{display:flex;align-items:center;justify-content:center;height:50px;border-radius:16px;text-decoration:none;
         font-weight:700;font-size:15px;background:#fff;color:var(--ink);border:1px solid rgba(27,42,58,.08)}
  .none{display:block;font-size:15px;font-weight:500;letter-spacing:0;line-height:1.5;color:var(--muted)}
  .foot{text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/jettae-icon.png" alt=""><b id="appname">제때</b></div>
  <h1 id="title"></h1>
  <section class="card" id="codecard">
    <div class="label" id="codelabel"></div>
    <div class="code" id="code"></div>
    <button class="copy" id="copy" type="button"></button>
  </section>
  <section class="card"><ol id="steps"></ol></section>
  <div class="stores">
    <a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.junish.jettae&amp;referrer=utm_source%3Dinvite%26utm_campaign%3Dinvite">Google Play</a>
    <a class="store" id="ios" href="https://apps.apple.com/app/id6815519683?pt=129127072&amp;ct=invite&amp;mt=8">App Store</a>
  </div>
  <div class="foot">Junish · 제때</div>
</main>
<script>
  // 초대 코드는 앱이 만든 8자리(대문자·숫자). 그 밖의 값은 보여 주지 않는다(페이지에 임의 글자를 찍지 않게).
  var raw = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  var code = /^[A-Z0-9]{4,12}$/.test(raw) ? raw : '';
  var T = {
    ko:{app:'제때',title:'<strong>같이 쓰는 공간</strong>에<br>초대받았어요',label:'초대 코드',copy:'코드 복사',copied:'복사했어요',
        steps:['제때 앱을 설치하고 로그인해요','공간 탭 → ‘초대 코드로 들어가기’','이 코드를 넣으면 같이 챙길 수 있어요'],none:'초대 코드가 없어요. 받은 링크를 다시 열어 주세요.'},
    en:{app:'Jettae',title:'You\'re invited to a<br><strong>shared space</strong>',label:'Invite code',copy:'Copy code',copied:'Copied',
        steps:['Install Jettae and sign in','Spaces tab → “Join with invite code”','Enter this code to keep track together'],none:'No invite code. Please open the link you received again.'},
    ja:{app:'Jettae',title:'<strong>共有スペース</strong>に<br>招待されました',label:'招待コード',copy:'コードをコピー',copied:'コピーしました',
        steps:['Jettaeをインストールしてログイン','スペースタブ →「招待コードで参加」','このコードを入力すると一緒に管理できます'],none:'招待コードがありません。受け取ったリンクをもう一度開いてください。'},
    es:{app:'Jettae',title:'Te invitaron a un<br><strong>espacio compartido</strong>',label:'Código de invitación',copy:'Copiar código',copied:'Copiado',
        steps:['Instala Jettae e inicia sesión','Pestaña Espacios → «Unirme con código»','Ingresa este código para organizarse juntos'],none:'No hay código de invitación. Vuelve a abrir el enlace que recibiste.'}
  };
  var lang = (navigator.language || 'ko').slice(0,2);
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : 'en';
  document.getElementById('appname').textContent = t.app;
  document.getElementById('title').innerHTML = t.title;
  document.getElementById('codelabel').textContent = t.label;
  var steps = document.getElementById('steps');
  t.steps.forEach(function(s){ var li=document.createElement('li'); li.textContent=s; steps.appendChild(li); });
  var btn = document.getElementById('copy');
  if (code) {
    document.getElementById('code').textContent = code;
    btn.textContent = t.copy;
    btn.onclick = function(){
      var done = function(){ btn.textContent = t.copied; btn.classList.add('done'); };
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, done); else done();
    };
  } else {
    document.getElementById('code').innerHTML = '<span class="none"></span>';
    document.querySelector('#code .none').textContent = t.none;
    btn.style.display = 'none';
  }
  // 기기에 맞는 스토어를 앞에(다른 하나는 숨김).
  var ua = navigator.userAgent;
  if (/Android/i.test(ua)) document.getElementById('ios').style.display = 'none';
  else if (/iPhone|iPad|iPod/i.test(ua)) document.getElementById('play').style.display = 'none';
</script>
</body>
</html>
