<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정산 · 척척총무</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="정산 내역 · 척척총무">
<meta property="og:description" content="누가 무엇을 얼마 썼고, 각자 얼마를 내는지.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E6EBE9;color:#1A1A1A;padding:24px 12px 56px;
       font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif}
  .paper{max-width:520px;margin:0 auto;background:#FBFAF7;border-radius:14px;
         padding:30px 22px 26px;box-shadow:0 10px 30px rgba(15,59,52,.12)}
  h1{margin:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:1px}
  .meta{margin-top:9px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#8A8A8A}
  hr{border:0;border-top:1.4px dashed #CFCBC2;margin:16px 0}
  h2{margin:0 0 8px;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:2px}
  .date{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
        font-weight:700;font-size:14px;margin:12px 0 3px}
  .date span:last-child{color:#8A8A8A;font-weight:500}
  .row{display:flex;align-items:baseline;gap:8px;font-family:'IBM Plex Mono',monospace;
       font-size:13.5px;color:#3A3A3A;padding:2px 0}
  .row.in{padding-left:16px}
  /* 긴 항목명이 줄바꿈되며 줄을 무너뜨리지 않게 한 줄로 자른다. */
  .row>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
                        max-width:52%;flex:0 1 auto}
  .row .note{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .row .lead{flex:1;border-bottom:1.5px dotted #D5D1C8;transform:translateY(-4px);min-width:12px}
  .row .amt{width:92px;text-align:right;white-space:nowrap}
  .note{font-size:11.5px;color:#8A8A8A;white-space:nowrap}
  .total{display:flex;justify-content:space-between;align-items:baseline;
         font-family:'IBM Plex Mono',monospace;font-weight:700}
  .total .l{font-size:17px;letter-spacing:2px}
  .total .r{font-size:20px}
  .person{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
          font-weight:700;font-size:15px;margin:14px 0 3px}
  .net{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
       font-weight:700;font-size:13.5px;color:#0F3B34;padding-left:16px;margin-top:5px}
  .send{background:#EAF3F0;border-radius:10px;padding:11px 13px;margin:7px 0;
        font-family:'IBM Plex Mono',monospace}
  .send .top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;color:#0F3B34}
  .send .acc{margin-top:6px;font-size:12px;color:#4C5D59;display:flex;justify-content:space-between;gap:8px}
  .send button{border:0;background:#0F3B34;color:#fff;border-radius:7px;padding:4px 9px;
               font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
  .foot{margin-top:18px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A8A8A;line-height:1.6}
  .brand{margin-top:12px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;letter-spacing:3px}
  /* 아래 두 배너는 종이(영수증) 바깥에 둔다 — 정산 내용이 아니다. */
  .promo{max-width:520px;margin:16px auto 0;background:#FBFAF7;border-radius:14px;
         padding:18px 18px 20px;box-shadow:0 10px 30px rgba(15,59,52,.12);text-align:center}
  .promo .t{font-size:14px;font-weight:700;color:#0F3B34}
  .promo .d{margin-top:5px;font-size:12px;color:#4C5D59;line-height:1.6}
  .stores{display:flex;gap:8px;margin-top:12px}
  .store{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
         border:0;border-radius:10px;padding:11px 8px;cursor:pointer;
         background:#0F3B34;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700}
  .store.alt{background:#EAF3F0;color:#0F3B34}
  .store svg{width:15px;height:15px;flex:none}
  .promo .soon{margin-top:9px;font-size:11px;color:#8A8A8A;min-height:14px}
  /* 광고 자리. 실제 스크립트를 붙일 때 이 박스 안을 갈아 끼운다. */
  .ad{max-width:520px;margin:12px auto 0;height:100px;border-radius:14px;
      border:1.4px dashed #B9C6C2;background:#F1F5F3;display:flex;
      align-items:center;justify-content:center;color:#8A9C97;
      font-size:12px;letter-spacing:2px;font-family:'IBM Plex Mono',monospace}
  .state{max-width:420px;margin:90px auto;text-align:center;color:#4C5D59;line-height:1.8}
  .state .big{font-size:36px}
  .state h2{letter-spacing:0;font-size:18px;margin:14px 0 8px;font-family:inherit}
</style>
</head>
<body>
<div id="app"><div class="state"><div class="big">🧾</div><p>불러오는 중…</p></div></div>
<script>
const FN = 'https://fvdihfmpjmgoffxosrmj.supabase.co/functions/v1/settle-share/';
const app = document.getElementById('app');
const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const num = n => (n || 0).toLocaleString('ko-KR');

function state(emoji, title, body) {
  app.innerHTML = `<div class="state"><div class="big">${emoji}</div>
    <h2>${title}</h2><p>${body}</p><div class="brand">척척총무</div></div>`;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// 항목 한 줄: 이름 · (메모) ······ 금액
function line(title, note, amount, indent) {
  const row = el('div', 'row' + (indent ? ' in' : ''));
  row.appendChild(el('span', null, title));
  if (note) row.appendChild(el('span', 'note', note));
  row.appendChild(el('span', 'lead'));
  row.appendChild(el('span', 'amt', num(amount)));
  return row;
}

function render(data) {
  const s = data.snapshot;
  document.title = (s.title || '정산') + ' · 척척총무';

  const paper = el('div', 'paper');
  paper.appendChild(el('h1', null, s.title || '정산'));
  paper.appendChild(el('div', 'meta',
    [s.date, s.groupName, (s.members || []).length + '명'].filter(Boolean).join('  ·  ')));
  paper.appendChild(el('hr'));

  // 날짜별 결제 항목
  paper.appendChild(el('h2', null, '결제 항목'));
  const groups = {};
  (s.expenses || []).forEach(e => (groups[e.date || ''] ||= []).push(e));
  Object.keys(groups)
    .sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b)))
    .forEach(k => {
      const sum = groups[k].reduce((t, e) => t + (e.amount || 0), 0);
      const head = el('div', 'date');
      head.appendChild(el('span', null, k || '날짜 없음'));
      head.appendChild(el('span', null, num(sum)));
      paper.appendChild(head);
      groups[k].forEach(e => paper.appendChild(
        line(e.title || '이름 없는 항목', `${e.payerName} 결제 · ${e.count}명`, e.amount, false)));
    });

  paper.appendChild(el('hr'));
  const total = el('div', 'total');
  total.appendChild(el('span', 'l', '합계'));
  total.appendChild(el('span', 'r', won(s.total)));
  paper.appendChild(total);
  paper.appendChild(el('hr'));

  // 개인별 낸 돈 — 누가 얼마를 대신 결제했나
  const payers = (s.balances || []).filter(b => (b.paidItems || []).length);
  if (payers.length) {
    paper.appendChild(el('h2', null, '개인별 낸 돈'));
    payers.forEach(b => {
      const head = el('div', 'person');
      head.appendChild(el('span', null, b.name));
      head.appendChild(el('span', null, '낸 돈 ' + num(b.paid)));
      paper.appendChild(head);
      b.paidItems.forEach(i =>
        paper.appendChild(line(i.title || '이름 없는 항목', '', i.amount, true)));
    });
    paper.appendChild(el('hr'));
  }

  // 개인별 내는 돈
  paper.appendChild(el('h2', null, '개인별 내는 돈'));
  (s.balances || []).forEach(b => {
    const head = el('div', 'person');
    head.appendChild(el('span', null, b.name));
    head.appendChild(el('span', null, '낼 돈 ' + num(b.owed)));
    paper.appendChild(head);
    (b.items || []).filter(i => i.amount !== 0).forEach(i =>
      paper.appendChild(line(i.title || '이름 없는 항목', i.payerName + ' 결제', i.amount, true)));
    if (b.paid) {
      const paid = line('낸 돈', '', -b.paid, true);
      paid.style.color = '#8A8A8A';
      paper.appendChild(paid);
    }
    const net = el('div', 'net');
    net.appendChild(el('span', null, b.net > 0 ? '받을 돈' : b.net < 0 ? '보낼 돈' : '정산 완료'));
    net.appendChild(el('span', null, won(Math.abs(b.net || 0))));
    paper.appendChild(net);
  });

  // 보낼 돈
  if ((s.transfers || []).length) {
    paper.appendChild(el('hr'));
    paper.appendChild(el('h2', null, '보낼 돈'));
    s.transfers.forEach(t => {
      const box = el('div', 'send');
      const top = el('div', 'top');
      top.appendChild(el('span', null, `${t.fromName} → ${t.toName}`));
      top.appendChild(el('span', null, won(t.amount)));
      box.appendChild(top);
      if (t.account) {
        const acc = el('div', 'acc');
        acc.appendChild(el('span', null, t.account));
        const btn = el('button', null, '복사');
        btn.onclick = () => {
          navigator.clipboard.writeText(t.account);
          btn.textContent = '복사됨';
          setTimeout(() => (btn.textContent = '복사'), 1200);
        };
        acc.appendChild(btn);
        box.appendChild(acc);
      }
      paper.appendChild(box);
    });
    if (!data.includeAccounts) {
      paper.appendChild(el('div', 'foot', '계좌는 링크에 담지 않았습니다'));
    }
  }

  const days = Math.max(0,
    Math.ceil((new Date(data.expiresAt) - Date.now()) / 86400000));
  paper.appendChild(el('div', 'foot', `이 링크는 ${days}일 뒤 만료됩니다`));
  paper.appendChild(el('div', 'brand', '척척총무'));

  app.innerHTML = '';
  app.appendChild(paper);
  app.appendChild(promo());
  app.appendChild(ad());
}

/// 앱 설치 배너. 아직 스토어 주소가 없어서 누르면 안내만 띄운다.
function promo() {
  const box = el('div', 'promo');
  box.appendChild(el('div', 't', '정산은 척척총무로'));
  box.appendChild(el('div', 'd',
    '영수증을 넣으면 누가 누구에게 얼마를 보낼지 알아서 계산합니다.'));

  const row = el('div', 'stores');
  const note = el('div', 'soon');
  [['Google Play', ''], ['App Store', 'alt']].forEach(([name, cls]) => {
    const btn = el('button', 'store' + (cls ? ' ' + cls : ''));
    btn.appendChild(el('span', null, name + '에서 받기'));
    btn.onclick = () => {
      note.textContent = '출시 준비 중입니다';
      setTimeout(() => (note.textContent = ''), 1800);
    };
    row.appendChild(btn);
  });
  box.appendChild(row);
  box.appendChild(note);
  return box;
}

/// 광고 자리.
function ad() {
  return el('div', 'ad', 'AD');
}

// 토큰은 해시로 받는다 — 그래야 서버 로그에 남지 않는다.
const token = (location.hash || '').replace(/^#/, '').trim()
  || new URLSearchParams(location.search).get('t') || '';

if (!token) {
  state('🔗', '링크가 올바르지 않습니다', '정산을 만든 사람에게 링크를 다시 받아 주세요.');
} else {
  fetch(FN + encodeURIComponent(token))
    .then(async r => {
      const body = await r.json().catch(() => ({}));
      if (r.ok) return render(body);
      if (r.status === 410) {
        state('⏳', '링크가 만료되었습니다', '정산을 만든 사람에게 새 링크를 받아 주세요.');
      } else if (r.status === 404) {
        state('🧾', '정산을 찾을 수 없습니다', '링크가 취소되었거나 주소가 잘못되었습니다.');
      } else {
        state('⚠️', '불러오지 못했습니다', '잠시 뒤 다시 열어 주세요.');
      }
    })
    .catch(() => state('⚠️', '불러오지 못했습니다', '인터넷 연결을 확인해 주세요.'));
}
</script>
</body>
</html>
