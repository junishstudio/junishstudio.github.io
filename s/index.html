<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정산 · 딱정산</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3F2ED">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7554737322558391" crossorigin="anonymous"></script>
<meta property="og:title" content="정산 내역 · 딱정산">
<meta property="og:image" content="https://junishstudio.github.io/s/og.png">
<meta property="og:description" content="누가 무엇을 얼마 썼고, 각자 얼마를 내는지.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  /* v4 시안(딱정산_v4_코드정합 · A) — 영수증 그대로, 잉크·라임. 색은 앱 tokens.dart와 같다. */
  :root{--paper:#F3F2ED;--ink:#14161A;--lime:#D9F26A;--green:#1F7A57;--coral:#E4572E;
        --sub:#6F757C;--muted:#9AA1A8;--line:#E6E5DF;--hair:#EFEEE9;--dash:#C9CDD1;--track:#E9E8E2;
        --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
        --sans:Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);padding:20px 12px 40px;font-family:var(--sans);
       -webkit-text-size-adjust:100%}
  #app{max-width:520px;margin:0 auto}
  .ico{display:block;flex:none}
  .num{font-variant-numeric:tabular-nums}

  /* 종이 — 위·아래 톱니(절취선). 로딩 뒤 위에서 "인쇄"되며 내려온다. */
  .paper{position:relative;background:#fff;border-radius:6px;padding:26px 22px 24px;
         box-shadow:0 10px 30px rgba(20,22,26,.12);animation:print .6s cubic-bezier(.2,.7,.2,1) both}
  .paper::before,.paper::after{content:'';position:absolute;left:0;right:0;height:12px;
         background:radial-gradient(circle at 6px 6px,var(--paper) 5px,transparent 5.5px) 0 0/12px 12px repeat-x}
  .paper::before{top:-6px}
  .paper::after{bottom:-6px}
  @keyframes print{from{clip-path:inset(-20px -40px 100% -40px)}to{clip-path:inset(-20px -40px -40px -40px)}}
  @media (prefers-reduced-motion:reduce){.paper{animation:none}}

  .brandrow{display:flex;align-items:center;justify-content:center;gap:8px}
  .wordmark{font-family:'Black Han Sans',var(--sans);font-size:16px;letter-spacing:.02em}
  h1{margin:14px 0 0;text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:.04em;
     font-weight:700;overflow-wrap:anywhere}
  .meta{margin-top:8px;text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--sub)}
  .total{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;
         font-family:var(--mono);font-weight:700}
  .total .l{font-size:15px;letter-spacing:.2em}
  .total .r{font-size:24px}
  .total .r small{font-size:14px;margin-left:2px}
  .mincount{margin-top:4px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--sub)}
  .mincount b{background:var(--lime);color:var(--ink);padding:0 4px;border-radius:3px;font-weight:700}
  hr{border:0;border-top:1.5px dashed var(--dash);margin:16px 0}
  h2{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.2em;font-weight:700}
  .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sechead .hint{font-size:11px;color:var(--sub)}

  /* 이름 칩 필터 */
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .chip{height:26px;padding:0 10px;border-radius:13px;border:0;background:var(--paper);color:var(--ink);
        display:inline-flex;align-items:center;font:400 12px var(--sans);cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;font-weight:600}

  /* 사람 캡슐 — 앱 PersonColors와 같은 파스텔 */
  .pill{display:inline-block;height:26px;line-height:26px;padding:0 10px;border-radius:13px;
        font-size:12.5px;font-weight:600;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis;
        min-width:0;flex:0 1 auto}

  /* 송금 카드 — 첫 장만 잉크 반전 */
  .send{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
  .send .top{display:flex;align-items:center;gap:7px;min-width:0}
  .send .top .arrow{color:var(--muted)}
  .send .amt{margin-left:auto;padding-left:4px;font-family:var(--mono);font-size:19px;font-weight:700;white-space:nowrap}
  .send .acc{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;
             font-family:var(--mono);font-size:12px;color:#4C5259}
  .send .acc>span{overflow-wrap:anywhere;min-width:0}
  .copy{height:26px;padding:0 10px;border-radius:13px;border:0;background:var(--ink);color:#fff;flex:none;
        display:inline-flex;align-items:center;gap:4px;font:700 11px var(--sans);cursor:pointer}
  .copy.done{background:var(--lime);color:var(--ink)}
  .send.hero{background:var(--ink);border-color:var(--ink);color:#fff}
  .send.hero .amt{color:var(--lime)}
  .send.hero .acc{color:#C7CCD1}
  .send.hero .copy{background:var(--lime);color:var(--ink)}
  .send.hero .copy.done{background:#fff}
  .empty{font-size:12px;color:var(--sub);padding:6px 0 2px}

  /* 결제 항목 · 점선 리더 */
  .date{display:flex;justify-content:space-between;font-family:var(--mono);font-weight:700;font-size:13.5px;margin:10px 0 3px}
  .date span:last-child{color:var(--sub);font-weight:500}
  .row{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:13.5px;padding:3px 0}
  .row.in{font-size:13px;padding-left:16px}
  .row.sub{color:var(--sub)}
  /* 긴 항목명이 줄을 무너뜨리지 않게 한 줄로 자른다. */
  .row>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%;flex:0 1 auto}
  .row .note{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .row .lead{flex:1;border-bottom:1.5px dotted var(--dash);transform:translateY(-4px);min-width:12px}
  .row .amt{width:70px;text-align:right;white-space:nowrap;flex:none}

  /* 타입별 */
  h2.types{margin-bottom:6px}
  /* 카테고리 아이콘 — 앱과 같은 옅은 색 타일 + 잉크 선 아이콘 */
  .cico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;
        margin-right:6px;vertical-align:-3px;font-size:11px;line-height:1;flex:none;background:var(--hair)}
  .cico svg{display:block}
  .accs{margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:4px 14px}
  .accs .accrow{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:13px}
  .accs .accrow+.accrow{border-top:1px solid var(--hair)}
  .accs .accrow>span.v{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--mono);font-size:12.5px}
  .cat{margin:8px 0 4px;font-family:var(--mono);font-size:13px}
  .cat .top{display:flex;justify-content:space-between;gap:8px}
  .cat .top span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat .top span:last-child{color:var(--sub);white-space:nowrap;flex-shrink:0}
  .cat .bar{height:6px;border-radius:3px;background:var(--hair);margin-top:4px;overflow:hidden}
  .cat .bar i{display:block;height:100%;border-radius:3px}

  /* 개인별 — 접힘 */
  h2.people{margin-bottom:4px}
  details.person{border-top:1px solid var(--hair)}
  details.person>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;
        align-items:center;padding:11px 0;gap:10px}
  details.person>summary::-webkit-details-marker{display:none}
  details.person>summary .amt{margin-left:auto;font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
  details.person>summary .caret{color:var(--muted);transition:transform .15s}
  details.person[open]>summary .caret{transform:rotate(180deg)}
  details.person>.body{padding:0 0 10px}
  .pos{color:var(--green)} .neg{color:var(--coral)} .zero{color:var(--sub)}

  .foot{text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--sub);line-height:1.7}
  .barcode{margin-top:14px;display:flex;justify-content:center}
  .barcode span{display:inline-block;height:34px;width:180px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}
  .tag{margin-top:6px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--muted);
       overflow-wrap:anywhere}

  /* 종이 밖 — 광고 · 설치 배너 · 앱 목록 */
  /* 광고 자리(320×100) — 웹 광고 계정이 생기기 전까지 Junish 다른 앱을 하나씩 돌려 보여 준다. */
  .ad{position:relative;margin:22px auto 0;height:100px;border-radius:14px;background:#fff;display:flex;align-items:center;
      gap:14px;padding:0 16px;color:var(--ink);text-decoration:none;box-shadow:0 1px 0 var(--line)}
  .ad img,.ad .no{width:60px;height:60px;border-radius:14px;flex:none;object-fit:cover}
  .ad .no{background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
  .ad .txt{min-width:0;flex:1}
  .ad .n{font-size:15px;font-weight:700}
  .ad .g{margin-top:3px;font-size:12.5px;color:var(--sub);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
         -webkit-box-orient:vertical;overflow:hidden}
  .ad .go{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--ink);color:#fff;font-size:12.5px;
          font-weight:600;display:flex;align-items:center}
  .ad .lab{position:absolute;top:6px;right:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
  .promo{margin-top:14px;background:var(--ink);border-radius:22px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:12px}
  .promo .head{display:flex;align-items:center;gap:12px}
  .promo .t{font-size:15px;font-weight:700}
  .promo .d{margin-top:2px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .stores{display:flex;gap:8px}
  .store{flex:1;height:42px;border-radius:21px;border:0;background:var(--lime);color:var(--ink);display:flex;
         align-items:center;justify-content:center;gap:7px;font:700 13px var(--sans);cursor:pointer}
  .store.alt{background:#2A2E35;color:#fff}
  .promo .soon{margin-top:-4px;font-size:12px;color:var(--muted);text-align:center}
  .promo .soon:empty{display:none}
  .apps{margin-top:10px;background:#fff;border-radius:22px;padding:6px 16px}
  .apps>.t{padding:10px 0 6px;font-size:12.5px;font-weight:700;color:var(--sub)}
  .app{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--hair)}
  .app img,.app .no{width:38px;height:38px;border-radius:11px;flex:none;background:var(--track)}
  .app .no{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .app .txt{flex:1;min-width:0}
  .app .n{font-size:13.5px;font-weight:700}
  .app .g{font-size:11.5px;color:var(--sub);line-height:1.45}
  .app .links{display:flex;gap:6px;flex:none}
  .app .links a{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
                background:var(--track);color:var(--ink)}
  .app .links a.p{background:var(--ink);color:#fff}
  /* 아직 그 스토어에 없는 앱 — 자리는 두고 눌리면 안내만 */
  .app .links button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
                background:var(--track);color:var(--ink);border:0;opacity:.35;cursor:default;padding:0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;
         background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;
         box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .2s}
  .toast.on{opacity:1}

  /* 상태 화면 — 만료 · 없음 · 로딩 */
  .state{max-width:340px;margin:72px auto 0;background:#fff;border-radius:18px;padding:22px 16px;text-align:center}
  .state .logo{width:44px;height:44px;opacity:.35;margin:0 auto}
  .state .dots{height:44px;display:flex;align-items:center;justify-content:center;gap:5px}
  .state .dots i{width:8px;height:8px;border-radius:50%;background:var(--ink);animation:blink 1s infinite}
  .state .dots i:nth-child(2){animation-delay:.2s} .state .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  .state .t{margin-top:10px;font-size:15px;font-weight:700}
  .state .d{margin-top:4px;font-size:12.5px;color:var(--sub);line-height:1.5}
  .state .c{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .state + .brandrow{margin-top:18px}
  .adsense{max-width:480px;margin:14px auto 0;min-height:1px;overflow:hidden}
  /* 불러오는 동안에도 영수증 모양 그대로 — 내용만 회색 자리 */
  .paper.loading .sk{background:var(--track);border-radius:6px;animation:sk 1.2s ease-in-out infinite}
  .paper.loading .sk-title{height:26px;width:52%;margin:16px auto 0}
  .paper.loading .sk-meta{height:13px;width:70%;margin:10px auto 0}
  .paper.loading .sk-total{height:30px;width:100%;margin:18px 0 0}
  .paper.loading .sk-line{height:14px;width:100%;margin-top:12px}
  .paper.loading .sk-line.short{width:60%}
  .paper.loading .loadtext{margin-top:20px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
  @keyframes sk{0%,100%{opacity:.55}50%{opacity:1}}
  /* 개인별 상자 안 '부담액' 줄 — 항목 합계라 조금 진하게 */
  .row.sum{font-weight:700}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="m-a" viewBox="0 0 100 100"><path d="M50 0C72.5 0 84.6 0 92.3 7.7C100 15.4 100 27.5 100 50C100 72.5 100 84.6 92.3 92.3C84.6 100 72.5 100 50 100C27.5 100 15.4 100 7.7 92.3C0 84.6 0 72.5 0 50C0 27.5 0 15.4 7.7 7.7C15.4 0 27.5 0 50 0Z" fill="#14161A"/><path d="M31 19h38q3 0 3 3v55l-5.7-4.6L60.6 77 54.9 72.4 49.2 77 43.5 72.4 37.8 77 32.1 72.4 26.4 77 28 22q0-3 3-3z" fill="#D9F26A"/><path d="M38 31h24M38 39h24M38 47h14" fill="none" stroke="#14161A" stroke-width="3.4" stroke-linecap="round" opacity=".28"/><path d="M39 59l7.5 7.5L62 51" fill="none" stroke="#14161A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div id="app"><div class="paper loading">
  <div class="brandrow"><svg class="ico" width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><use href="#m-a"></use></svg><span class="wordmark">딱정산</span></div>

  <div class="sk sk-line"></div>

<script>
const FN = 'https://fvdihfmpjmgoffxosrmj.supabase.co/functions/v1/ddak-share/';

/// 애드센스 게시자 ID(ca-pub-…). 비어 있으면 광고 자리는 Junish 앱 하우스 광고가 채운다.
/// 계정 승인 뒤 이 값과 SLOT만 채우면 바로 켜진다.
const ADSENSE_CLIENT = 'ca-pub-7554737322558391';
const ADSENSE_SLOT = '';

/// 승인된 계정이 있을 때만 애드센스 스크립트를 싣는다(없으면 요청조차 하지 않는다).
function adsenseBox() {
  if (!ADSENSE_CLIENT || !ADSENSE_SLOT) return null;
  if (!document.querySelector('script[data-adsense]')) {
    const tag = document.createElement('script');
    tag.async = true;
    tag.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' +
      encodeURIComponent(ADSENSE_CLIENT);
    tag.crossOrigin = 'anonymous';
    tag.setAttribute('data-adsense', '1');
    document.head.appendChild(tag);
  }
  const box = el('div', 'adsense');
  const ins = document.createElement('ins');
  ins.className = 'adsbygoogle';
  ins.style.display = 'block';
  ins.setAttribute('data-ad-client', ADSENSE_CLIENT);
  ins.setAttribute('data-ad-slot', ADSENSE_SLOT);
  ins.setAttribute('data-ad-format', 'auto');
  ins.setAttribute('data-full-width-responsive', 'true');
  box.appendChild(ins);
  // 자리가 화면에 붙은 뒤에 채우라고 알린다.
  requestAnimationFrame(() => {
    try {
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    } catch (_) {
      // 차단기·네트워크 실패는 조용히 넘긴다 — 본문은 그대로 보인다.
    }
  });
  return box;
}
const app = document.getElementById('app');

// 사람 캡슐 색. 앱 PersonColors.pairs와 같은 순서 — 인원 순서대로 배정한다.
const PERSON = [
  ['#DCEBE6', '#0F5C4C'], ['#FBE6DE', '#A8432A'], ['#DFEAF4', '#2C5F86'], ['#EFE3F3', '#6E3F84'],
  ['#F6ECDC', '#8A5A1C'], ['#E6E8EE', '#4A5060'], ['#F0E4E0', '#7A3F33'],
];
// 카테고리 막대. 앱 barPalette(잉크 → 라임 → 회색).
const BARS = ['#14161A', '#D9F26A', '#C9CDD1', '#9AA1A8', '#E9E8E2'];

const won = n => (n || 0).toLocaleString('ko-KR') + '원';
const num = n => (n || 0).toLocaleString('ko-KR');
const minus = n => (n ? '−' : '') + num(n);
// 부호를 항상 붙인다. +1,000 / −1,000
let toastTimer = 0;
function toast(text) {
  let box = document.querySelector('.toast');
  if (!box) {
    box = el('div', 'toast');
    document.body.appendChild(box);
  }
  box.textContent = text;
  requestAnimationFrame(() => box.classList.add('on'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('on'), 2200);
}

const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n));

function icon(id, size, cls) {
  return `<svg class="ico ${cls || ''}" width="${size}" height="${size}" viewBox="0 0 ${id === 'm-a' ? 100 : 24} ${id === 'm-a' ? 100 : 24}" aria-hidden="true"><use href="#${id}"></use></svg>`;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function brandRow() {
  const r = el('div', 'brandrow');
  r.innerHTML = icon('m-a', 26);
  r.appendChild(el('span', 'wordmark', '딱정산'));
  return r;
}

function state(title, body, code) {
  const box = el('div', 'state');
  box.innerHTML = icon('m-a', 44, 'logo');
  box.appendChild(el('div', 't', title));
  box.appendChild(el('div', 'd', body));
  if (code) box.appendChild(el('div', 'c', code));
  app.innerHTML = '';
  app.append(box, brandRow());
}

// 카테고리 id → {name, color, icon(path), emoji}. 스냅샷이 싣고 온다(없으면 아이콘 없이).
let STYLES = {};
const SVGNS = 'http://www.w3.org/2000/svg';
const hexOk = c => typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c);
function cico(id) {
  const st = id && STYLES[id];
  if (!st) return null;
  const c = el('span', 'cico');
  if (hexOk(st.color)) c.style.background = st.color + '2E';
  if (st.icon) {
    // innerHTML 대신 DOM으로 — 링크 내용은 남이 만든 데이터다.
    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', '12');
    svg.setAttribute('height', '12');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', '#14161A');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', String(st.icon));
    svg.appendChild(path);
    c.appendChild(svg);
  } else {
    c.textContent = st.emoji || '·';
  }
  return c;
}

// 항목 한 줄: [아이콘] 이름 · (메모) ······ 금액
function line(title, note, amount, cls, catId) {
  const row = el('div', 'row' + (cls ? ' ' + cls : ''));
  const t = el('span');
  const ic = cico(catId);
  if (ic) t.appendChild(ic);
  t.append(title);
  row.appendChild(t);
  if (note) row.appendChild(el('span', 'note', note));
  row.appendChild(el('span', 'lead'));
  row.appendChild(el('span', 'amt num', amount));
  return row;
}

let colorOf = () => PERSON[0];
function pill(name) {
  const p = el('span', 'pill', name);
  const [bg, fg] = colorOf(name);
  p.style.background = bg;
  p.style.color = fg;
  return p;
}

/// 한 사람의 상세. 이름·금액만 보이고 항목은 눌러야 펴진다.
function personBox(name, amountLabel, tone, fill) {
  const box = el('details', 'person');
  box.dataset.name = name;
  const summary = el('summary');
  summary.appendChild(pill(name));
  summary.appendChild(el('span', 'amt num ' + tone, amountLabel));
  summary.insertAdjacentHTML('beforeend', icon('i-down', 14, 'caret'));
  box.appendChild(summary);
  const body = el('div', 'body');
  fill(body);
  box.appendChild(body);
  return box;
}

function transferCard(t, perTransferAccount) {
  const box = el('div', 'send');
  const top = el('div', 'top');
  top.appendChild(pill(t.fromName));
  top.insertAdjacentHTML('beforeend', icon('i-arrow', 14, 'arrow'));
  top.appendChild(pill(t.toName));
  top.appendChild(el('span', 'amt num', num(t.amount)));
  box.appendChild(top);
  if (perTransferAccount && t.account) {
    const acc = el('div', 'acc');
    acc.appendChild(el('span', null, t.account));
    const btn = el('button', 'copy');
    btn.type = 'button';
    btn.innerHTML = icon('i-copy', 11);
    const label = el('span', null, '복사');
    btn.appendChild(label);
    btn.onclick = () => {
      navigator.clipboard.writeText(t.account);
      label.textContent = '복사됨';
      btn.classList.add('done');
      setTimeout(() => { label.textContent = '복사'; btn.classList.remove('done'); }, 1200);
    };
    acc.appendChild(btn);
    box.appendChild(acc);
  }
  return box;
}

// 이름 칩 선택은 이 기기에만 남긴다(링크마다 따로).
function loadMe() { try { return localStorage.getItem('ddak-share-me:' + token) || ''; } catch (_) { return ''; } }
function saveMe(v) { try { v ? localStorage.setItem('ddak-share-me:' + token, v) : localStorage.removeItem('ddak-share-me:' + token); } catch (_) {} }

function render(data) {
  const s = data.snapshot;
  const members = s.members || [];
  STYLES = (s.categoryStyles && typeof s.categoryStyles === 'object') ? s.categoryStyles : {};
  // 새 앱은 계좌를 사람마다 한 번(accounts)만 싣는다. 예전 링크는 송금마다 붙어 온다.
  const accounts = Array.isArray(s.accounts) ? s.accounts : null;
  document.title = (s.title || '정산') + ' · 딱정산';
  colorOf = name => {
    const i = members.indexOf(name);
    if (i >= 0) return PERSON[i % PERSON.length];
    let h = 0;
    for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) | 0;
    return PERSON[Math.abs(h) % PERSON.length];
  };

  const paper = el('div', 'paper');
  paper.appendChild(brandRow());
  paper.appendChild(el('h1', null, s.title || '정산'));
  const expenses = s.expenses || [];
  paper.appendChild(el('div', 'meta',
    [s.date, s.groupName, members.length + '명', expenses.length + '건'].filter(Boolean).join(' · ')));
  // 어떻게 계산했는지 — 송금 방식과 단위 맞추기.
  const how = [s.strategy, s.rounding].filter(Boolean).join(' · ');
  if (how) paper.appendChild(el('div', 'meta', how));

  const total = el('div', 'total');
  total.appendChild(el('span', 'l', '합계'));
  const tr = el('span', 'r num', num(s.total));
  tr.appendChild(el('small', null, '원'));
  total.appendChild(tr);
  paper.appendChild(total);

  const transfers = s.transfers || [];
  if (transfers.length) {
    const mc = el('div', 'mincount');
    mc.append((s.strategy || '최소 송금') + ' · ', el('b', null, transfers.length + '건'), '이면 끝');
    paper.appendChild(mc);
  }

  // 보낼 돈 — 합계 바로 아래. 이름을 고르면 내 송금만 남는다.
  let people = [];
  if (transfers.length) {
    paper.appendChild(el('hr'));
    const head = el('div', 'sechead');
    head.appendChild(el('h2', null, '보낼 돈'));
    const showChips = members.length > 1;
    if (showChips) head.appendChild(el('span', 'hint', '내 이름 → 내 것만'));
    paper.appendChild(head);

    const list = el('div');
    let me = loadMe();
    if (me && !members.includes(me)) me = '';
    const chips = el('div', 'chips');
    const apply = () => {
      [...chips.children].forEach(c => c.classList.toggle('on', c.dataset.name === me));
      list.innerHTML = '';
      const mine = transfers.filter(t => !me || t.fromName === me || t.toName === me);
      mine.forEach(t => list.appendChild(transferCard(t, !accounts)));
      if (!mine.length) list.appendChild(el('div', 'empty', `${me} 님은 주고받을 돈이 없습니다`));
      // 내 개인별 항목은 자동으로 펼친다.
      people.forEach(d => (d.open = !!me && d.dataset.name === me));
    };
    if (showChips) {
      ['', ...members].forEach(name => {
        const c = el('button', 'chip', name || '전체');
        c.type = 'button';
        c.dataset.name = name;
        c.onclick = () => { me = name; saveMe(me); apply(); };
        chips.appendChild(c);
      });
      paper.appendChild(chips);
    }
    paper.appendChild(list);
    // 계좌 — 받는 사람마다 한 줄씩, 송금 목록과 따로.
    if (accounts && accounts.length) {
      const box = el('div', 'accs');
      accounts.forEach(a => {
        const row = el('div', 'accrow');
        row.appendChild(pill(a.name));
        row.appendChild(el('span', 'v', a.account));
        const btn = el('button', 'copy');
        btn.type = 'button';
        btn.innerHTML = icon('i-copy', 11);
        const label = el('span', null, '복사');
        btn.appendChild(label);
        btn.onclick = () => {
          navigator.clipboard.writeText(a.account);
          label.textContent = '복사됨';
          btn.classList.add('done');
          setTimeout(() => { label.textContent = '복사'; btn.classList.remove('done'); }, 1200);
        };
        row.appendChild(btn);
        box.appendChild(row);
      });
      const head2 = el('div', 'sechead');
      head2.style.marginTop = '14px';
      head2.appendChild(el('h2', null, '계좌'));
      paper.appendChild(head2);
      paper.appendChild(box);
    }
    // 개인별 상자를 만든 뒤에 적용한다.
    queueMicrotask(apply);
  }

  // 날짜별 결제 항목
  paper.appendChild(el('hr'));
  paper.appendChild(el('h2', null, '결제 항목'));
  const groups = {};
  expenses.forEach(e => (groups[e.date || ''] ||= []).push(e));
  Object.keys(groups)
    .sort((a, b) => (a === '' ? 1 : b === '' ? -1 : a.localeCompare(b)))
    .forEach(k => {
      const sum = groups[k].reduce((t, e) => t + (e.amount || 0), 0);
      const head = el('div', 'date');
      head.appendChild(el('span', null, k || '날짜 없음'));
      head.appendChild(el('span', 'num', num(sum)));
      paper.appendChild(head);
      groups[k].forEach(e => paper.appendChild(
        line(e.title || '이름 없는 항목',
             `${e.payerName} 결제 · ${e.count}명${e.foreign ? ' · ' + e.foreign : ''}`,
             num(e.amount), null, e.categoryId)));
    });

  // 타입(카테고리)별 — 어디에 얼마를 썼나, 비율까지.
  if ((s.categories || []).length) {
    paper.appendChild(el('hr'));
    paper.appendChild(el('h2', 'types', '타입별'));
    s.categories.forEach((c, i) => {
      const box = el('div', 'cat');
      const top = el('div', 'top');
      const lab = el('span');
      const ic = cico(c.categoryId);
      if (ic) lab.appendChild(ic);
      lab.append(c.label);
      top.appendChild(lab);
      top.appendChild(el('span', 'num', `${Math.round((c.ratio || 0) * 100)}% · ${num(c.amount)}`));
      box.appendChild(top);
      const bar = el('div', 'bar');
      const fill = el('i');
      fill.style.width = `${Math.max(2, (c.ratio || 0) * 100)}%`;
      const st = STYLES[c.categoryId];
      fill.style.background = st && hexOk(st.color) ? st.color : BARS[i % BARS.length];
      bar.appendChild(fill);
      box.appendChild(bar);
      paper.appendChild(box);
    });
  }

  // 개인별 낸 돈 — 누가 얼마를 대신 결제했나. 상세는 눌러야 펴진다.
  const payers = (s.balances || []).filter(b => (b.paidItems || []).length);
  if (payers.length) {
    paper.appendChild(el('hr'));
    paper.appendChild(el('h2', 'people', '개인별 낸 돈'));
    payers.forEach(b => paper.appendChild(
      personBox(b.name, '낸 돈 ' + num(b.paid), '', body => {
        b.paidItems.forEach(i =>
          body.appendChild(line(i.title || '이름 없는 항목', '', num(i.amount), 'in', i.categoryId)));
      })));
  }

  // 개인별 내는 돈 — 맨 마지막. 각자 자기 것만 펴 본다.
  paper.appendChild(el('hr'));
  paper.appendChild(el('h2', 'people', '개인별 내는 돈'));
  (s.balances || []).forEach(b => {
    const net = b.net || 0;
    const label = net > 0 ? '받을 ' + num(net) : net < 0 ? '보낼 ' + num(-net) : '정산 완료';
    const box = personBox(b.name, label, net > 0 ? 'pos' : net < 0 ? 'neg' : 'zero', body => {
      (b.items || []).filter(i => i.amount !== 0).forEach(i =>
        body.appendChild(line(i.title || '이름 없는 항목', i.payerName + ' 결제', num(i.amount), 'in', i.categoryId)));
      // 항목 → 조정 → 단위 → 합계(부담액) 순. 더하고 빼는 과정을 먼저 보여 준다.
      if (b.adjust) body.appendChild(
        line('개인 조정', b.adjust > 0 ? '더 냄' : '덜 냄', signed(b.adjust), 'in sub'));
      if (b.rounding) body.appendChild(
        line(s.rounding || '단위 맞추기', b.rounding > 0 ? '더 냄' : '덜 냄', signed(b.rounding), 'in sub'));
      // 이 사람이 실제로 져야 할 몫. 위 항목·조정·단위를 모두 더한 값이다.
      if (b.owed !== undefined) body.appendChild(line('부담액', '', num(b.owed), 'in sum'));
      if (b.paid) body.appendChild(line('낸 돈', '', minus(b.paid), 'in sub'));
      if (b.prepaid) body.appendChild(line('미리 낸 회비', '', minus(b.prepaid), 'in sub'));
    });
    people.push(box);
    paper.appendChild(box);
  });

  const days = Math.max(0,
    Math.ceil((new Date(data.expiresAt) - Date.now()) / 86400000));
  // 홍보용처럼 아주 먼 만료일은 날수를 세는 게 무의미하다.
  const expiry = days > 365 ? '만료 없음' : `${days}일 뒤 만료`;
  // 앱에서 정산을 고치면 같은 링크 내용이 바뀐다. 언제 기준인지 보여 준다.
  paper.appendChild(el('hr'));
  const foot = el('div', 'foot');
  foot.append(`${s.updatedAt ? s.updatedAt + ' 기준 · ' : ''}${expiry}`, el('br'),
    data.includeAccounts ? '계좌는 만든 사람이 켰을 때만 담깁니다' : '계좌는 링크에 담지 않았습니다');
  paper.appendChild(foot);
  const bc = el('div', 'barcode');
  bc.appendChild(el('span'));
  paper.appendChild(bc);
  const year = (s.date || s.updatedAt || String(new Date().getFullYear())).slice(0, 4);
  paper.appendChild(el('div', 'tag',
    `DDAK · ${year} · #${(s.title || '정산').replace(/\s+/g, '')}`));

  app.innerHTML = '';
  app.appendChild(paper);
  const ad = adsenseBox() || houseAd(data.apps);
  if (ad) app.appendChild(ad);
  app.appendChild(promo());
  const list = apps(data.apps);
  if (list) app.appendChild(list);
}

/// Junish 앱 목록. 스토어 주소는 서버(junish_apps)가 준다 —
/// 이 페이지를 다시 배포하지 않아도 최신이다.
function apps(rows) {
  if (!Array.isArray(rows) || !rows.length) return null;
  const box = el('div', 'apps');
  box.appendChild(el('div', 't', '이런 앱도 만들고 있습니다'));
  rows.forEach(a => {
    const row = el('div', 'app');
    const initial = () => el('div', 'no', (a.name_ko || '?')[0]);
    if (a.icon_url) {
      const img = el('img');
      img.src = a.icon_url;
      img.alt = '';
      img.loading = 'lazy';
      // 아이콘을 못 불러오면 첫 글자로 대신한다.
      img.onerror = () => img.replaceWith(initial());
      row.appendChild(img);
    } else {
      row.appendChild(initial());
    }

    const txt = el('div', 'txt');
    txt.appendChild(el('div', 'n', a.name_ko || a.id));
    if (a.tagline_ko) txt.appendChild(el('div', 'g', a.tagline_ko));
    row.appendChild(txt);

    const links = el('div', 'links');
    [
      [a.android_url, 'p', 'i-play', 'Google Play'],
      [a.ios_url, 'i', 'i-apple', 'App Store'],
    ].forEach(([href, cls, ic, label]) => {
      if (!href) {
        // 아직 그 스토어엔 없다 — 아이콘 자리는 두고 눌리면 안내만.
        const off = el('button');
        off.type = 'button';
        off.title = `${label}에는 아직 없습니다`;
        off.setAttribute('aria-label', `${a.name_ko || a.id} · ${label}에는 아직 없습니다`);
        off.innerHTML = icon(ic, 14);
        off.onclick = () => toast(`${a.name_ko || a.id} · ${label}에는 아직 등록되지 않았습니다`);
        links.appendChild(off);
        return;
      }
      const link = el('a', cls);
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = label;
      link.setAttribute('aria-label', `${a.name_ko || a.id} · ${label}`);
      link.innerHTML = icon(ic, 14);
      links.appendChild(link);
    });
    row.appendChild(links);
    box.appendChild(row);
  });
  return box;
}

/// 앱 설치 배너. 아직 스토어 주소가 없어서 누르면 안내만 띄운다.
/// 광고 자리. 딱정산을 뺀 Junish 앱 중 하나를 골라(열 때마다 다르게) 스토어로 보낸다.
function houseAd(rows) {
  if (!Array.isArray(rows)) return null;
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const pool = rows.filter(a => a.id !== 'ddak' && (ios ? a.ios_url || a.android_url : a.android_url || a.ios_url));
  if (!pool.length) return null;
  const a = pool[Math.floor(Math.random() * pool.length)];
  const href = ios ? (a.ios_url || a.android_url) : (a.android_url || a.ios_url);
  if (!/^https:\/\//.test(href)) return null;
  const box = el('a', 'ad');
  box.href = href;
  box.target = '_blank';
  box.rel = 'noopener';
  const initial = () => el('div', 'no', (a.name_ko || '?')[0]);
  if (a.icon_url) {
    const img = el('img');
    img.src = a.icon_url;
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = () => img.replaceWith(initial());
    box.appendChild(img);
  } else {
    box.appendChild(initial());
  }
  const txt = el('div', 'txt');
  txt.appendChild(el('div', 'n', a.name_ko || a.id));
  if (a.tagline_ko) txt.appendChild(el('div', 'g', a.tagline_ko));
  box.appendChild(txt);
  box.appendChild(el('span', 'go', '보기'));
  box.appendChild(el('span', 'lab', 'AD'));
  return box;
}

function promo() {
  const box = el('div', 'promo');
  const head = el('div', 'head');
  head.innerHTML = icon('m-a', 42);
  const txt = el('div');
  txt.appendChild(el('div', 't', '다음 정산은 딱정산으로'));
  txt.appendChild(el('div', 'd', '쓴 돈만 적으면 누가 누구에게 얼마, 계좌까지.'));
  head.appendChild(txt);
  box.appendChild(head);

  const row = el('div', 'stores');
  const note = el('div', 'soon');
  [['Google Play', '', 'i-play'], ['App Store', 'alt', 'i-apple']].forEach(([name, cls, ic]) => {
    const btn = el('button', 'store' + (cls ? ' ' + cls : ''));
    btn.type = 'button';
    btn.innerHTML = icon(ic, 14);
    btn.appendChild(el('span', null, name));
    btn.onclick = () => {
      note.textContent = '출시 준비 중입니다';
      setTimeout(() => (note.textContent = ''), 1800);
    };
    row.appendChild(btn);
  });
  box.appendChild(row);
  box.appendChild(note);
  return box;
}

// 토큰은 해시로 받는다 — 그래야 서버 로그에 남지 않는다.
const token = (location.hash || '').replace(/^#/, '').trim()
  || new URLSearchParams(location.search).get('t') || '';

if (!token) {
  state('링크가 올바르지 않습니다', '정산을 만든 사람에게 링크를 다시 받아 주세요.');
} else {
  fetch(FN + encodeURIComponent(token))
    .then(async r => {
      const body = await r.json().catch(() => ({}));
      if (r.ok) return render(body);
      if (r.status === 410) {
        state('링크가 만료되었습니다', '정산을 만든 사람에게 새 링크를 받아 주세요.', '410');
      } else if (r.status === 404) {
        state('정산을 찾을 수 없습니다', '링크가 취소되었거나 주소가 잘못되었습니다.', '404');
      } else {
        state('불러오지 못했습니다', '잠시 뒤 다시 열어 주세요.');
      }
    })
    .catch(() => state('불러오지 못했습니다', '인터넷 연결을 확인해 주세요.'));
}
</script>
</body>
</html>
