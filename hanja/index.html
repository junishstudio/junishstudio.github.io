var S=(new URLSearchParams(location.search).get('src')||'').replace(/[^\w-]/g,'').slice(0,30)||'link';
function T(u){return /apple\.com/.test(u)?u+'?pt=129127072&ct='+S+'&mt=8':u+'&referrer=utm_source%3D'+S+'%26utm_campaign%3D'+S}

(function(){var u=navigator.userAgent,aos=/Android/.test(u),A='https://play.google.com/store/apps/details?id=com.junish.hanja';
if(aos)location.replace(T(A));})();
</script>
