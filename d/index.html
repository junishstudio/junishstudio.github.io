<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초대 · 딱정산</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D9F26A">
<meta property="og:title" content="딱정산 — 모임에 초대받았어요">
<meta property="og:description" content="들어와서 내 이름을 고르면 모임 정산을 같이 봐요.">
<meta property="og:image" content="https://junishstudio.github.io/ddak/icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 딱정산 v9 "라임 팝"(lib/ui/widgets/v9.dart와 같은 색). 초대 코드 공유 링크 착지 페이지 — 코드를 보여 주고 앱으로 안내한다. */
  :root{--lime:#D9F26A;--ink:#14161A;--sub:#5E636A;--card:#F3F4F1;
        --sans:Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--lime);color:var(--ink);font-family:var(--sans);
       -webkit-text-size-adjust:100%;word-break:keep-all}
  main{max-width:420px;margin:0 auto;padding:40px 16px 40px;display:flex;flex-direction:column;gap:14px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px}
  .brand img{width:44px;height:44px;border-radius:12px}
  .brand b{font-size:15px;font-weight:600}
  h1{margin:12px 6px 8px;font-size:34px;font-weight:900;letter-spacing:-.045em;line-height:1.2}
  .card{background:#fff;border-radius:22px;padding:20px 18px}
  .label{font-size:12.5px;font-weight:600;text-align:center}
  .code{margin-top:6px;font-size:34px;font-weight:900;letter-spacing:.12em;text-align:center;
        font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .copy{margin-top:14px;width:100%;height:50px;border:0;border-radius:25px;background:var(--card);color:var(--ink);
        font:700 15px var(--sans);cursor:pointer}
  .copy.done{background:var(--lime)}
  ol{margin:0;padding-left:20px;font-size:14.5px;line-height:1.75}
  .open{display:flex;align-items:center;justify-content:center;height:56px;border-radius:28px;text-decoration:none;
        font-weight:800;font-size:16px;background:var(--ink);color:#fff}
  .hint{margin:8px 0 0;text-align:center;font-size:13px;color:var(--ink)}
  .stores{display:flex;flex-direction:column;gap:8px}
  .store{display:flex;align-items:center;justify-content:center;height:50px;border-radius:25px;text-decoration:none;
         font-weight:700;font-size:15px;background:rgba(20,22,26,.08);color:var(--ink)}
  .none{display:block;font-size:15px;font-weight:500;letter-spacing:0;line-height:1.5;color:var(--sub)}
  .foot{text-align:center;font-size:12px;color:var(--ink);opacity:.6}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/ddak/icon.png" alt=""><b>딱정산</b></div>
  <h1>모임에<br>초대받았어요</h1>
  <section class="card">
    <div class="label">초대 코드</div>
    <div class="code" id="code"></div>
    <button class="copy" id="copy" type="button">코드 복사</button>
  </section>
  <section class="card"><ol>
    <li>딱정산 앱을 설치하고 로그인해요</li>
    <li>이 페이지로 돌아와 ‘앱에서 열기’를 눌러요</li>
    <li>모임에서 내 이름을 고르면 정산을 같이 봐요</li>
  </ol></section>
  <div id="openwrap" style="display:none">
    <a class="open" id="open" href="#">앱에서 열기</a>
    <p class="hint">앱이 없으면 아래에서 설치해 주세요</p>
  </div>
  <div class="stores">
    <a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.junish.ddak&amp;referrer=utm_source%3Dinvite%26utm_campaign%3Dinvite">Google Play</a>
    <a class="store" id="ios" href="https://apps.apple.com/app/id6813096267?pt=129127072&amp;ct=invite&amp;mt=8">App Store</a>
  </div>
  <div class="foot">Junish · 딱정산</div>
</main>
<script>
  // 초대 코드는 앱이 만든 8자리(대문자·숫자). 그 밖의 값은 보여 주지 않는다(페이지에 임의 글자를 찍지 않게).
  var raw = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  var code = /^[A-Z0-9]{4,12}$/.test(raw) ? raw : '';
  var btn = document.getElementById('copy');
  if (code) {
    document.getElementById('code').textContent = code.length === 8 ? code.slice(0,4) + ' ' + code.slice(4) : code;
    // 앱이 설치돼 있으면 바로 초대 확인 화면으로(없으면 아무 일도 없어서 아래 스토어 안내).
    document.getElementById('open').href = 'com.junish.ddak://join?c=' + code;
    document.getElementById('openwrap').style.display = '';
    btn.onclick = function(){
      var done = function(){ btn.textContent = '복사했어요'; btn.classList.add('done'); };
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, done); else done();
    };
  } else {
    document.getElementById('code').innerHTML = '<span class="none">초대 코드가 없어요. 받은 링크를 다시 열어 주세요.</span>';
    btn.style.display = 'none';
  }
  // 기기에 맞는 스토어만(아이패드는 Mac으로 보여 터치 여부로 가린다).
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (/Android/i.test(ua)) document.getElementById('ios').style.display = 'none';
  else if (ios) document.getElementById('play').style.display = 'none';
</script>
</body>
</html>
